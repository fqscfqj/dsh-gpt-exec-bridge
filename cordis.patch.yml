- insert:
    - id: gpt-exec-bridge
      name: 'dsh-gpt-exec-bridge'
      config:
        enabled: true
        rules:
          - tool: list_subagent_models
            fields:
              - provider
              - model
          - tool: subagent
            fields:
              - provider
              - model
              - reasoning_effort
              - agent_preset
              - cwd
          - tool: subagent_fork
            fields:
              - provider
              - model
              - reasoning_effort
              - agent_preset
              - cwd
          - tool: team_task_list
            fields:
              - status
              - owner
              - unowned
            exclusive:
              - - owner
                - unowned
          - tool: team_task_update
            fields:
              - subject
              - description
              - owner
